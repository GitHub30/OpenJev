[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.1.0"
description = "Open-weight System One decision engine compatible with the TypeSafe Jev /v1/systemone API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
hf = [
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
train = [
    "torch>=2.1",
    "transformers>=4.45",
    "peft>=0.10",
    "datasets>=2.18",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
openjev = "openjev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
